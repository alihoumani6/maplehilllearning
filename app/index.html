Object.assign(ACT,{hbuy2(){gate(()=>buyHearts(true))},hprac2(){endLesson();startMixed(true)},hrefill2(){const p=P();if(p.gems<100){toast('You need 💎100');return}p.gems-=100;p.hearts=5;save();endLesson();toast('Hearts refilled!')},pw2(){endLesson();paywall()},home2(){endLesson()}});

function finish(){tickStop();L.state='end';$('fb').style.display='none';$('lf').style.display='none';$('pb').style.width='100%';const p=P();
 const tot=L.total,acc=Math.round(L.ok1/tot*100),pass=acc>=70||L.kind==='heart',secs=Math.round((Date.now()-L.t0)/1000);const mult=p.boost>Date.now()?2:1;
 if(!pass){const xp0=L.ok*2;p.xp+=xp0;p.wxp+=xp0;p.q.xp+=xp0;save();L.screens=[];$('lb').innerHTML=`<div class="end"><img class="mi" src="${av(p.av)}" style="animation:none" alt=""><h1>Almost there!</h1><p style="font-weight:700">You got ${acc}%. Score 70% or more to pass and unlock the next lesson. ${MASC[p.av][0]} believes in you!</p><div class="res"><div style="border-color:#1d5fd1;color:#1d5fd1"><small>Score</small><span>${acc}%</span></div><div style="border-color:#ffc928;color:#a67600"><small>XP</small><span>+${xp0}</span></div></div><button class="btn full" data-act="retryl">Try again</button><p></p><button class="btn ghost full" data-act="home2">Back to map</button></div>`;return}
 let xp=(10+L.ok*2+(acc>=100?10:0)+(L.boss?15:0))*mult,gems=10+(acc>=100?5:0)+(L.boss?10:0);if(L.kind==='mist'||L.kind==='heart')xp=Math.round(xp/2),gems=0;
 const screens=[];const t=dk();let newDay=false;
 p.xp+=xp;p.wxp+=xp;p.gems+=gems;p.q.xp+=xp;p.q.les++;if(acc>=90)p.q.great++;p.lessons++;if(acc>=100)p.perfect++;if(L.boss&&L.kind==='path')p.bosses++;
 if(L.kind==='path'){const key=p.grade+L.subj;const d=p.prog[key]||0;if(L.n===d)p.prog[key]=d+1}
 if(L.kind==='heart'){p.hearts=Math.min(5,p.hearts+1);p.hAt=p.hearts>=5?0:Date.now()}
 if(acc>=100&&L.kind==='path'&&!isPlus()){p.hearts=Math.min(5,p.hearts+1)}
 if(p.last!==t){newDay=true;const y=addD(t,-1);p.streak=(p.last===y)?p.streak+1:1;p.last=t;p.best=Math.max(p.best,p.streak);p.days.push(t)}
 S.done++;save();
 let h=`<div class="end"><img class="mi" src="${av(p.av)}" alt=""><h1>${L.kind==='heart'?'Heart earned! ❤️':L.boss?'Boss defeated!':'Lesson complete!'}</h1><div class="res"><div style="border-color:#ffc928;color:#a67600"><small>XP${mult>1?' ×2':''}</small><span>+${xp}</span></div><div style="border-color:#1f9d5b;color:#14703f"><small>Score</small><span>${acc}%</span></div><div style="border-color:#1d5fd1;color:#1d5fd1"><small>Time</small><span>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</span></div></div>${gems?`<p style="font-weight:800">💎 +${gems} gems</p>`:''}${L.best>=5?`<p style="font-weight:800;color:var(--orange)">🔥 Best combo: ${L.best} in a row</p>`:''}<button class="btn full" data-act="next">Continue</button></div>`;
 screens.push(h);
 if(newDay){const wk=wkStart(t);const wd=[0,1,2,3,4,5,6].map(i=>addD(wk,i));screens.push(`<div class="end"><div style="font-size:90px;animation:bob 1s infinite">🔥</div><h1>${p.streak} day streak!</h1><p style="font-weight:700">${p.streak>1?'You are on fire. Come back tomorrow to keep it going.':'Your streak has started. Practise every day to grow it!'}</p><div class="week">${wd.map((k,i)=>`<div>${'MTWTFSS'[i]}<b class="${p.days.includes(k)?'on':''}">${p.days.includes(k)?'🔥':''}</b></div>`).join('')}</div><button class="btn full" data-act="next">Continue</button></div>`)}
 if(p.q.xp>=p.goal&&p.q.xp-xp<p.goal)screens.push(`<div class="end"><div style="font-size:90px">🎯</div><h1>Daily goal reached!</h1><p style="font-weight:700">${p.q.xp} XP today. Amazing, ${p.name}!</p><button class="btn full" data-act="next">Continue</button></div>`);
 const nb=BADGES.filter(b=>b[2](p)&&!(p.bd||[]).includes(b[1]));if(nb.length){p.bd=(p.bd||[]).concat(nb.map(b=>b[1]));screens.push(`<div class="end"><div style="font-size:90px">${nb[0][0]}</div><h1>New badge!</h1><p style="font-weight:800;font-size:20px">${nb[0][1]}</p><button class="btn full" data-act="next">Continue</button></div>`)}
 if(!isPlus()&&L.kind!=='heart'){if(S.done===3||(S.done>3&&S.lastPw!==t&&S.done%5===0)){screens.push('PW');S.lastPw=t}}
 save();L.screens=screens;sWIN();confetti();nextScreen()}
