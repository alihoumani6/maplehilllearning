<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maple Leap – Learn Like a Game</title>
<meta name="description" content="Maple Leap by Maple Hill Learning Press: bite-size math, reading and logic lessons for Pre-K to Grade 6: letters, sounds, reading, writing, math and logic. Free to play.">
<meta name="theme-color" content="#d62828"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#d62828;--navy:#12306b;--blue:#1d5fd1;--sun:#ffc928;--green:#1f9d5b;--orange:#f47b20;--purple:#7b45c9;--paper:#fffdf6;--ink:#1d2433;--line:#e3e6ee;--mut:#5b6478}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;-webkit-user-select:none;user-select:none}
h1,h2,h3,.bal{font-family:'Baloo 2',Nunito,sans-serif}
button{font:inherit;cursor:pointer}a{color:var(--blue)}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 100px}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 0 10px;position:sticky;top:0;background:var(--paper);z-index:5}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:4px;color:var(--ink);cursor:pointer}
.chip.plus{background:linear-gradient(135deg,#7b45c9,#1d5fd1);color:#fff;border:0}
.btn{border:0;border-radius:16px;padding:14px 22px;font-weight:800;font-size:16px;color:#fff;background:var(--green);box-shadow:0 5px 0 #14703f;text-transform:uppercase;letter-spacing:.03em;display:inline-block;text-align:center;text-decoration:none}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #14703f}
.btn.red{background:var(--red);box-shadow:0 5px 0 #8f1717}.btn.red:active{box-shadow:0 1px 0 #8f1717}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 #144a9e}.btn.purple{background:var(--purple);box-shadow:0 5px 0 #5a2f99}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:12px;box-shadow:0 3px 0 #14703f}
.btn:disabled{background:#d7dbe4!important;box-shadow:0 5px 0 #b9bfcc!important;color:#8b93a5!important;cursor:default}
.full{width:100%}
.hero{text-align:center;padding:24px 0 6px}.hero img{width:170px;height:170px;object-fit:contain;animation:bob 1.6s ease-in-out infinite}
.hero h1{margin:6px 0 2px;font-size:42px;color:var(--navy)}.hero p{margin:0 0 18px;color:var(--mut);font-weight:700;font-size:17px}
.step{padding-top:20px}.step h2{font-size:28px;color:var(--navy);margin:8px 0 14px;text-align:center}
.grades,.avs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gc{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 6px;text-align:center;font-weight:800;color:var(--navy);box-shadow:0 4px 0 var(--line)}
.gc img{width:62px;height:62px;object-fit:contain;display:block;margin:0 auto 2px}.gc.on{border-color:var(--blue);background:#eef4ff;box-shadow:0 4px 0 var(--blue)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:8px 0;font-weight:800;box-shadow:0 4px 0 var(--line);color:var(--ink)}
.opt.on{border-color:var(--blue);background:#eef4ff;box-shadow:0 4px 0 var(--blue)}.opt small{margin-left:auto;color:var(--mut)}
.in{width:100%;font:800 22px 'Baloo 2';padding:12px 14px;border:2px solid var(--line);border-radius:14px;color:var(--navy);-webkit-user-select:text;user-select:text}.in:focus{outline:0;border-color:var(--blue)}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0}.dots i{width:9px;height:9px;border-radius:50%;background:#d7dbe4}.dots i.on{background:var(--blue)}
.tabs{display:flex;gap:8px;margin:4px 0 12px}
.tab{flex:1;border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 2px;font-weight:800;color:var(--mut);box-shadow:0 3px 0 var(--line);font-size:14px}
.unit{border-radius:18px;color:#fff;padding:14px 16px;margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.unit small{opacity:.9;font-weight:800;letter-spacing:.04em}.unit h3{margin:0;font-size:21px;line-height:1.1}.unit p{margin:2px 0 0;font-size:13px;font-weight:700;opacity:.95}
.path{display:flex;flex-direction:column;align-items:center;padding:30px 0 6px}
.pn{position:relative;margin-bottom:46px;display:flex;align-items:center}
.node{position:relative;width:76px;height:76px;border-radius:50%;border:0;color:#fff;font-size:30px;font-weight:800;display:grid;place-items:center;box-shadow:0 7px 0 rgba(0,0,0,.28)}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.node.lock{background:#d7dbe4!important;color:#9aa2b4;box-shadow:0 7px 0 #b9bfcc}
.node.done::after{content:"★";position:absolute;right:-6px;top:-6px;background:var(--sun);color:#7a5200;width:26px;height:26px;border-radius:50%;font-size:14px;display:grid;place-items:center;border:3px solid var(--paper)}
.node.cur{animation:bob 1.3s ease-in-out infinite}
.node.chest{background:var(--orange)!important;border-radius:22px}
.tag{background:#fff;color:var(--green);border:2px solid var(--line);border-radius:12px;padding:3px 10px;font-weight:800;font-size:13px;position:absolute;top:-34px;left:50%;transform:translateX(-50%);white-space:nowrap;box-shadow:0 3px 0 var(--line)}
.tag::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.pm{position:absolute;right:calc(100% + 12px);width:62px;height:62px;object-fit:contain}
@keyframes bob{50%{transform:translateY(-6px)}}
#lesson,#modal,#adv{position:fixed;inset:0;display:none;flex-direction:column}
#lesson{background:var(--paper);z-index:20}
.lh{display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto;padding:14px 16px}
.x{border:0;background:none;font-size:26px;color:#8b93a5;font-weight:800}
.bar{flex:1;height:16px;background:#e6e9f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .35s;position:relative}
.hearts{font-weight:800;color:var(--red);font-size:18px;min-width:46px;text-align:right}
.lb{flex:1;overflow:auto;max-width:560px;width:100%;margin:0 auto;padding:6px 16px 20px}
.q{font-family:'Baloo 2';font-size:25px;font-weight:800;color:var(--navy);line-height:1.2;white-space:pre-line;margin:8px 0 14px}
.spk{border:2px solid var(--line);background:#fff;border-radius:12px;font-size:18px;padding:4px 9px;margin-left:8px;vertical-align:middle}
.passage{background:#fff7de;border:2px solid #f3dd8b;border-radius:16px;padding:14px;font-weight:700;margin-top:6px;line-height:1.45;-webkit-user-select:text;user-select:text}
.svg{text-align:center;margin-bottom:8px}
.ch{display:grid;gap:10px}.ch button{background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 16px;font-weight:800;font-size:18px;color:var(--ink);text-align:left;box-shadow:0 4px 0 var(--line)}
.ch.big button{font-size:30px;text-align:center}
.ch button.sel{border-color:var(--blue);background:#eef4ff;box-shadow:0 4px 0 var(--blue)}.ch button.ok{border-color:var(--green);background:#e5f7ec;box-shadow:0 4px 0 var(--green)}.ch button.no{border-color:var(--red);background:#fde8e8;box-shadow:0 4px 0 var(--red)}
.inp{width:100%;font:800 28px 'Baloo 2';text-align:center;padding:14px;border:2px solid var(--line);border-radius:16px;color:var(--navy);box-shadow:0 4px 0 var(--line);-webkit-user-select:text;user-select:text}.inp:focus{outline:0;border-color:var(--blue)}
.slots{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:14px}.bank{display:flex;flex-wrap:wrap;gap:8px}
.w{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800;font-size:17px;box-shadow:0 3px 0 var(--line)}.w.used{opacity:.25;pointer-events:none}
.lf{border-top:2px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--paper)}.lf>div{max-width:560px;margin:0 auto;display:flex;gap:12px}.lf .btn{flex:1}.lf .btn.ghost{flex:0 0 auto}
.fb{display:none;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}.fb.ok{background:#d8f3e2;color:#14703f}.fb.no{background:#fbdada;color:#8f1717}
.fb>div{max-width:560px;margin:0 auto}.fb .m{display:flex;gap:10px;align-items:center;margin-bottom:10px}.fb img{width:54px;height:54px;object-fit:contain}.fb b{font:800 22px 'Baloo 2'}.fb p{margin:0;font-weight:700}
.fb .btn{width:100%}.fb.no .btn{background:var(--red);box-shadow:0 5px 0 #8f1717}
.combo{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--orange);color:#fff;font-weight:800;border-radius:99px;padding:6px 16px;z-index:30;display:none;box-shadow:0 4px 0 #b25209}
.end{text-align:center;padding:26px 8px}.end img.mi{width:170px;height:170px;object-fit:contain;animation:bob 1.2s infinite}.end h1{font-size:34px;color:var(--navy);margin:8px 0}
.res{display:flex;gap:10px;justify-content:center;margin:16px 0 24px}.res div{flex:1;max-width:130px;border:2px solid;border-radius:16px;padding:8px 4px;font-weight:800}.res small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em}.res span{font:800 24px 'Baloo 2'}
.week{display:flex;justify-content:center;gap:8px;margin:14px 0}.week div{font-size:12px;font-weight:800;color:var(--mut)}.week b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e6e9f0;margin-top:3px;font-size:16px}.week b.on{background:var(--orange)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav button{flex:1;max-width:110px;background:none;border:0;font-weight:800;color:#8b93a5;font-size:11px;border-radius:12px;padding:4px 2px}.nav button.on{color:var(--blue);background:#eef4ff}.nav button b{display:block;font-size:22px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0;font-weight:700}.card h3{margin:0 0 6px;color:var(--navy);font-size:19px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;font-weight:800}
.meter{height:12px;background:#e6e9f0;border-radius:99px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--sun);border-radius:99px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:800}.stat small{display:block;color:var(--mut);font-size:12px}.stat span{font:800 24px 'Baloo 2';color:var(--navy)}
.shk{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cf{position:fixed;inset:0;pointer-events:none;z-index:60}
#modal{background:rgba(18,26,48,.55);z-index:40;justify-content:flex-end;align-items:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s}.sheet.full{height:94vh}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:4px 0 8px;color:var(--navy);font-size:26px}.sheet .xx{float:right;border:0;background:none;font-size:24px;color:#8b93a5;font-weight:800}
.pw-hero{text-align:center;background:linear-gradient(160deg,#7b45c9,#1d5fd1);color:#fff;border-radius:20px;padding:16px;margin:6px 0 12px}.pw-hero img{width:90px;height:90px;object-fit:contain}.pw-hero h2{color:#fff;margin:0;font-size:30px}.pw-hero p{margin:2px 0 0;font-weight:700;opacity:.95}
.ben{list-style:none;padding:0;margin:8px 0}.ben li{padding:7px 0 7px 32px;position:relative;font-weight:800}.ben li::before{content:"✓";position:absolute;left:0;top:5px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.plan{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;font-weight:800;box-shadow:0 4px 0 var(--line);color:var(--ink)}.plan.on{border-color:var(--purple);background:#f4edff;box-shadow:0 4px 0 var(--purple)}.plan b{font:800 24px 'Baloo 2';display:block;color:var(--navy)}.plan small{display:block;color:var(--mut);font-size:12px}
.badge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;font-size:10px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.seg{display:flex;background:#e6e9f0;border-radius:14px;padding:4px;margin:6px 0}.seg button{flex:1;border:0;background:none;border-radius:11px;padding:8px;font-weight:800;color:var(--mut)}.seg button.on{background:#fff;color:var(--navy);box-shadow:0 2px 0 rgba(0,0,0,.1)}
.fine{font-size:12px;color:var(--mut);font-weight:700;text-align:center;margin:8px 0}
#adv{background:#12306b;z-index:50;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.ad{background:#fff;color:var(--ink);border-radius:22px;max-width:380px;width:100%;padding:18px;position:relative}.ad img.cv{width:150px;box-shadow:0 8px 20px rgba(0,0,0,.25);border-radius:6px}.ad h2{color:var(--navy);margin:10px 0 4px;font-size:26px}.ad p{margin:0 0 12px;font-weight:700;color:var(--mut)}
.adl{position:absolute;top:10px;left:12px;font-size:11px;font-weight:800;color:#8b93a5;text-transform:uppercase}.adx{position:absolute;top:6px;right:8px;border:0;background:#e6e9f0;border-radius:99px;min-width:34px;height:30px;font-weight:800;color:var(--mut)}
.banner{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 10px;margin:14px 0;font-weight:800;font-size:13px}.banner img{width:44px;border-radius:4px}.banner div{flex:1;line-height:1.2}.banner small{color:#8b93a5;display:block;font-size:10px;text-transform:uppercase}
.lr{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:12px;font-weight:800}.lr.me{background:#eef4ff;border:2px solid var(--blue)}.lr .rk{width:26px;text-align:center;color:var(--mut)}.lr img{width:36px;height:36px;object-fit:contain;background:#f1f3f8;border-radius:50%}.lr .nm{flex:1}
.zone{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--green);margin:6px 0}.zone::before,.zone::after{content:"";flex:1;height:2px;background:currentColor;opacity:.4}.zone.d{color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;font-weight:800;color:var(--mut)}.cal i{font-style:normal;display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font-size:12px;color:var(--ink);background:#f1f3f8}.cal i.on{background:var(--orange);color:#fff}.cal i.fz{background:#bfe3ff}.cal i.t{outline:2px solid var(--blue)}
.bars{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:6px}.bars div{flex:1;text-align:center;font-size:10px;font-weight:800;color:var(--mut)}.bars i{display:block;background:var(--blue);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:3px}
.bd{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:16px;background:#fff7de;border:2px solid #f3dd8b;font-size:28px;margin:4px}.bd.off{filter:grayscale(1);opacity:.4}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;z-index:70;max-width:90%;text-align:center}
@media (min-width:768px){.wrap,.lh,.lb,.lf>div,.fb>div,.sheet{max-width:720px}.q{font-size:32px}.ch button{font-size:22px;padding:18px 20px}.node{width:92px;height:92px;font-size:36px}.pm{width:80px;height:80px}.hero img{width:240px;height:240px}.nav button{max-width:150px;font-size:13px}.btn{font-size:18px}.sheet{border-radius:24px;margin-bottom:3vh}#modal{align-items:center;justify-content:center}.w{font-size:20px;padding:12px 18px}.grades,.avs{grid-template-columns:repeat(6,1fr)}.passage{font-size:19px}.inp{font-size:34px}}
@media (min-width:768px) and (orientation:landscape){.wrap{max-width:760px}}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pairs>div{display:grid;gap:10px;align-content:start}.pb{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 8px;font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--line);color:var(--ink)}.pb.sel{border-color:var(--blue);background:#eef4ff;box-shadow:0 4px 0 var(--blue)}.pb.okp{border-color:var(--green);background:#e5f7ec;box-shadow:0 4px 0 var(--green);opacity:.65;pointer-events:none}.pb.nop{border-color:var(--red);background:#fde8e8;animation:sh .35s}
html{touch-action:manipulation;overscroll-behavior:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- motion & delight ---- */
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes slideIn{from{transform:translateX(26px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px) scale(1.06)}55%{transform:translateY(0) scale(.96)}75%{transform:translateY(-6px)}}
@keyframes sadsh{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
@keyframes ring{0%{box-shadow:0 7px 0 rgba(0,0,0,.28),0 0 0 0 rgba(255,201,40,.7)}100%{box-shadow:0 7px 0 rgba(0,0,0,.28),0 0 0 16px rgba(255,201,40,0)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes flt{0%{transform:translate(-50%,0);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-60px);opacity:0}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes chestshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-10deg)}30%{transform:rotate(9deg)}45%{transform:rotate(-7deg)}60%{transform:rotate(6deg)}}
@keyframes starin{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes breathe{50%{transform:scale(1.04)}}
#app>*:not(.top){animation:fadeUp .32s both}
#lb>*{animation:slideIn .26s both}
#lb .ch button,#lb .pb,#lb .w{animation:pop .3s both}
#lb .ch button:nth-child(2),#lb .pairs>div>:nth-child(2){animation-delay:.05s}#lb .ch button:nth-child(3),#lb .pairs>div>:nth-child(3){animation-delay:.1s}#lb .ch button:nth-child(4),#lb .pairs>div>:nth-child(4){animation-delay:.15s}
.ch button:active,.pb:active,.w:active,.gc:active,.opt:active,.tab:active,.chip:active{transform:translateY(3px) scale(.985)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer 1.6s infinite}
.bar i{background:linear-gradient(90deg,#34c77b,#1f9d5b)}
.av{position:relative;display:inline-block;vertical-align:middle;flex:none}.av img{width:100%;height:100%;object-fit:contain;display:block}
.acc{position:absolute;transform:translateX(-50%);line-height:1;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.av.idle{animation:bob 2.4s ease-in-out infinite}.av.jump{animation:jump .6s}.av.sadsh{animation:sadsh .55s}.av.spin{animation:spin .9s}
.coach{display:flex;align-items:flex-end;gap:10px;margin:2px 0 8px}.bub{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 12px;font-weight:800;font-size:15px;color:var(--navy);margin-bottom:10px}
.bub::before{content:"";position:absolute;left:-8px;bottom:12px;width:12px;height:12px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
@media (max-height:660px){.coach .bub{display:none}}
